services:
  # ==========================================
  # 1. NestJS Backend Web Service
  # ==========================================
  - type: web
    name: auto-apply-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: auto-apply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: auto-apply-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PATH
        value: ./uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BROWSER_EXECUTABLE_PATH
        sync: false

  # ==========================================
  # 2. Next.js Frontend Web Service
  # ==========================================
  - type: web
    name: auto-apply-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://auto-apply-backend-8is9.onrender.com/api

  # BullMQ requires Redis for discovery and other background jobs.
  - type: keyvalue
    name: auto-apply-redis
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []

databases:
  # ==========================================
  # 3. PostgreSQL Database
  # ==========================================
  - name: auto-apply-db
    plan: free
    databaseName: auto_apply_job
    user: jobuser
